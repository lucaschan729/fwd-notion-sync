name: Update
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * 6-7 1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q curl_cffi requests openpyxl
      - run: python main.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fwd-excel
          path: output/*.xlsx
